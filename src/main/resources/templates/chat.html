<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ollama Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .chat-container {
    max-width: 90%;
            margin: 20px auto 0;
            font-family: monospace;
    color: #333;
    background-color: #f4f4f4;
    border: 1px solid #ccc;
    padding: 10px;
}

.chat-box {
    height: 500px;
    overflow-y: auto;
    border: 1px solid #aaa;
    background-color: #fff;
    padding: 10px;
    font-size: 20px;
    white-space: pre-wrap;
}

        .input-group {
    margin-top: 10px;
    background-color: #eaeaea;
    padding: 10px;
    border: 1px solid #ccc;
}

input#userMessage {
    background-color: #fff;
    color: #000;
    border: 1px solid #aaa;
    font-family: monospace;
}

button.btn.btn-primary {
    background-color: #ddd;
    color: #000;
    border: 1px solid #aaa;
}

pre, code {
    background-color: #eee;
    color: #111;
    font-family: monospace;
    padding: 2px;
    border: none;
}


    </style>
</head>
<body>
<div class="chat-container">
    <h3>Chat with Local LLM Using Ollama </h3>
    <div id="chatBox" class="chat-box mb-3"></div>

    <div class="input-group">
        <label for="userMessage"></label><input type="text" id="userMessage" class="form-control" placeholder="Type a message..." />
        <button onclick="sendMessage()" class="btn btn-primary">Send</button>
    </div>
</div>

<script>
    let socket;
    let chatBox;

    function appendMessage(sender, text, isMarkdown = false) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "message " + (sender === 'user' ? 'user justify-content-end' : 'ai');

        const msgBody = document.createElement("div");
        msgBody.className = "message-body";
        msgBody.innerHTML = isMarkdown ? marked.parse(text) : text;


        msgDiv.appendChild(msgBody);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTypingIndicator() {
        const typingDiv = document.createElement("div");
        typingDiv.id = "typing";
        typingDiv.className = "typing";
        typingDiv.innerText = "🤖 Ollama is typing...";
        chatBox.appendChild(typingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTypingIndicator() {
        const typingDiv = document.getElementById("typing");
        if (typingDiv) chatBox.removeChild(typingDiv);
    }

    function connectWebSocket() {
        socket = new WebSocket("ws://localhost:8080/ws/chat");

        socket.onopen = () => console.log("Connected");

        socket.onmessage = function (event) {
            removeTypingIndicator();
            appendMessage('ollama', "ollama-response: "+event.data, true); // true = render markdown
        };
    }

    function sendMessage() {
        const input = document.getElementById("userMessage");
        const msg = input.value.trim();
        if (msg === '') return;

        appendMessage('user', msg);
        socket.send(msg);
        input.value = '';
        showTypingIndicator();
    }

    window.onload = () => {
    chatBox = document.getElementById("chatBox");
    connectWebSocket();

    // Add Enter key handler for sending message
    const input = document.getElementById("userMessage");
    input.addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
            event.preventDefault(); // Prevent form submission or line break
            sendMessage();          // Call the sendMessage function
        }
    });
    };

</script>
</body>
</html>
